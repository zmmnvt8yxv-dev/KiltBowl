name: Validate archived Kilt Bowl fixture

on:
  workflow_dispatch:
  push:
    paths:
      - "data/kilt-bowl-2025.json"
      - "scripts/validate_fixture.py"
      - ".github/workflows/build-static-stats.yml"

permissions:
  contents: read

jobs:
  validate-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixture contract and result
        run: python3 scripts/validate_fixture.py
